# Personal devcontainer overrides which is merged on top docker-compose.yaml.

# A local docker-compose file is generated from this template at first container
# rebuild, allowing for setup customizations. 

# Do not edit this file unless you want the changes to be commited; instead amend
# docker-compose.local.yaml.

services:
  race_stack:
    volumes:
      # Keep every VS Code extension installed inside the container across rebuilds.
      - vscode-extensions:/home/race_crew/.vscode-server/extensions
      # General-purpose persistent home storage
      - persist:/home/race_crew/.persist
    # environment:
    #   # Example: keep Claude Code login and chat history across rebuilds
    #   - CLAUDE_CONFIG_DIR=/home/race_crew/.persist/claude

volumes:
  vscode-extensions:
  persist:
