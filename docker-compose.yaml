name: race_stack_${HOST_UID:-1000}

services:
  race_stack:
    image: race_stack:humble_${HOST_UID:-1000}
    pull_policy: never
    container_name: forzaeth_devcontainer_${HOST_UID:-1000} 
    hostname: ${RACECAR_VERSION:-SIM}
    extra_hosts:
      - "${RACECAR_VERSION:-SIM}:127.0.1.1"
    env_file:
      - .env
    runtime: ${DOCKER_RUNTIME:-runc} # Nvidia on Jetson
    network_mode: host
    ipc: host
    privileged: true
    shm_size: "1gb"
    init: true
    stdin_open: true
    tty: true
    command: bash -c "sudo chown -R $$(id -u):$$(id -g) /home/${USER}/.vscode-server /home/${USER}/.persist; sudo chown $$(id -u):$$(id -g) /ws; exec tail -f /dev/null"
    volumes:
      - /dev:/dev:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.docker_xauth:/tmp/.docker_xauth:ro
      - ../race_stack_deps:/ws/src:rw
      - ./:/ws/src/race_stack:rw
      - ../race_stack_maps:/ws/maps:rw
      - ../race_stack_bags:/ws/bags:rw
      - ws:/ws
    environment:
      - DISPLAY=${DISPLAY:-:${HOST_UID:-1000}}
      - XAUTHORITY=/tmp/.docker_xauth/xauth
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-48}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - RACECAR_VERSION=${RACECAR_VERSION:-SIM}
      - MAPS_DIR=/ws/maps
      - BAGS_DIR=/ws/bags
      - RCUTILS_COLORIZED_OUTPUT=1
      - TERM=xterm-256color
      - PYTHONPYCACHEPREFIX=/tmp/pycache
      - PYTHONWARNINGS=ignore:Unbuilt egg:UserWarning
      - CMAKE_EXPORT_COMPILE_COMMANDS=ON
      - COLCON_DEFAULTS_FILE=/ws/src/race_stack/.install_utils/colcon_defaults.yaml

  zenoh_router:
    profiles: [shared]
    image: race_stack:humble_${HOST_UID:-1000}
    pull_policy: never
    container_name: forzaeth_zenoh_router
    hostname: ${RACECAR_VERSION:-SIM}
    env_file:
      - .env
    network_mode: host
    ipc: host
    restart: unless-stopped
    command: bash -c "source /opt/ros/humble/setup.bash && exec ros2 run rmw_zenoh_cpp rmw_zenohd"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-48}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp

  # Foxglove bridge (ws://<host>:<FOXGLOVE_PORT>)
  foxglove_bridge:
    image: race_stack:humble_${HOST_UID:-1000}
    pull_policy: never
    container_name: forzaeth_foxglove_bridge_${HOST_UID:-1000}
    depends_on:
      - race_stack
    env_file:
      - .env
    network_mode: host
    restart: unless-stopped
    volumes:
      - ws:/ws:ro
      - ../race_stack_deps:/ws/src:ro
      - ./:/ws/src/race_stack:ro
    command: >
      bash -c "source /opt/ros/humble/setup.bash
      && if [ -f /ws/install/setup.bash ]; then source /ws/install/setup.bash; fi
      && exec ros2 launch foxglove_bridge foxglove_bridge_launch.xml address:=${FOXGLOVE_ADDRESS:-0.0.0.0} port:=${FOXGLOVE_PORT:-8765}"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-48}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp

  # Virtual desktop for visualisations (RVIZ), used by sessions without a display.
  novnc:
    image: forzaeth_novnc:latest
    pull_policy: never
    container_name: forzaeth_novnc_${HOST_UID:-1000}
    ipc: host
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    tmpfs:
      - /tmp
    environment:
      - USER_ID=${HOST_UID:-1000}
    ports:
      - "127.0.0.1:${NOVNC_X11_PORT:-7000}:${NOVNC_X11_PORT:-7000}"
      - "127.0.0.1:${NOVNC_WEB_PORT:-21000}:${NOVNC_WEB_PORT:-21000}"
    command:
      - bash
      - -c
      - |
        echo '<meta http-equiv="refresh" content="0; url=vnc.html?autoconnect=true&resize=scale">' > /usr/share/novnc/index.html
        exec /start_vnc.sh

# Named per host user, so users sharing a machine never share build artifacts
volumes:
  ws:
    name: race_stack_humble_ws_${HOST_UID:-1000}
