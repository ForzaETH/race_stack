services:
  race_stack:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        USER: race_crew
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
        IMAGE: ros:humble-ros-base
    container_name: forzaeth_devcontainer_${HOST_UID:-1000} # passing the user allows multiple users per machine
    image: race_stack:humble_dev_${HOST_UID:-1000}
    hostname: ${RACECAR_VERSION:-SIM}
    extra_hosts:
      - "${RACECAR_VERSION:-SIM}:127.0.1.1"
    env_file:
      - .env
    network_mode: host
    ipc: host
    privileged: true
    shm_size: "1gb"
    stdin_open: true
    tty: true
    # Named volumes keep the owner they were created with; re-own them to the current UID
    command: bash -c "sudo chown -R $$(id -u):$$(id -g) /home/race_crew/.vscode-server /home/race_crew/.persist; sudo chown $$(id -u):$$(id -g) /ws/build /ws/install /ws/log; exec tail -f /dev/null"
    init: true
    volumes:
      - /dev:/dev:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../race_stack_deps:/ws/src:rw
      - ./:/ws/src/race_stack:rw
      - ws-build:/ws/build
      - ws-install:/ws/install
      - ws-log:/ws/log
      - ../race_stack_maps:/ws/maps:rw
      - ../race_stack_bags:/ws/bags:rw
    environment:
      - USER=race_crew
      - USERNAME=race_crew
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-48}
      - RCUTILS_COLORIZED_OUTPUT=1
      - TERM=xterm-256color
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - RACECAR_VERSION=${RACECAR_VERSION:-SIM}
      - MAPS_DIR=/ws/maps
      - BAGS_DIR=/ws/bags
      - PYTHONPYCACHEPREFIX=/ws/build/.pycache
      - CMAKE_EXPORT_COMPILE_COMMANDS=ON

  zenoh_router:
    image: race_stack:humble_dev_${HOST_UID:-1000}
    pull_policy: never
    depends_on:
      - race_stack
    container_name: forzaeth_zenoh_router
    hostname: ${RACECAR_VERSION:-SIM}
    env_file:
      - .env
    network_mode: host
    ipc: host
    restart: unless-stopped
    command: bash -c "source /opt/ros/humble/setup.bash && exec ros2 run rmw_zenoh_cpp rmw_zenohd"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-48}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp

  # Foxglove bridge (ws://<host>:8765)
  foxglove_bridge:
    image: race_stack:humble_dev_${HOST_UID:-1000}
    pull_policy: never
    depends_on:
      - zenoh_router
    container_name: forzaeth_foxglove_bridge
    env_file:
      - .env
    network_mode: host
    restart: unless-stopped
    volumes:
      - ws-install:/ws/install:ro
    command: >
      bash -c "source /opt/ros/humble/setup.bash
      && if [ -f /ws/install/setup.bash ]; then source /ws/install/setup.bash; fi
      && exec ros2 launch foxglove_bridge foxglove_bridge_launch.xml address:=${FOXGLOVE_ADDRESS:-0.0.0.0}"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-48}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp

  # Virtual desktop for visualisations (RVIZ), required for MacOS
  novnc:
    build: https://github.com/ForzaETH/remote-novnc.git#main
    image: forzaeth_novnc:latest
    container_name: forzaeth_novnc
    profiles: ["novnc"] # Only start if this profile is enabled (only MacOS)
    restart: unless-stopped
    tmpfs:
      - /tmp
    environment:
      - USER_ID=501
    ports:
      - "127.0.0.1:6501:6501"   
      - "127.0.0.1:20501:20501"
    command:
      - bash
      - -c
      - |
        echo '<meta http-equiv="refresh" content="0; url=vnc.html?autoconnect=true&resize=scale">' > /usr/share/novnc/index.html
        exec /start_vnc.sh

# Named per host user, so users sharing a machine never share build artifacts
volumes:
  ws-build:
    name: race_stack_humble_build_${HOST_UID:-1000}
  ws-install:
    name: race_stack_humble_install_${HOST_UID:-1000}
  ws-log:
    name: race_stack_humble_log_${HOST_UID:-1000}
