services:
  race_stack:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        USER: race_crew
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
        IMAGE: ros:humble-ros-base
    container_name: forzaeth_devcontainer
    image: race_stack:humble_dev
    hostname: ${RACECAR_VERSION:-NUC1}
    extra_hosts:
      - "${RACECAR_VERSION:-NUC1}:127.0.1.1"
    env_file:
      - .env
    network_mode: host
    ipc: host
    privileged: true
    shm_size: "1gb"
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    volumes:
      - /dev:/dev:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./:/ws/src/race_stack:rw
      - ../race_stack_cache/humble/build:/ws/build:rw
      - ../race_stack_cache/humble/install:/ws/install:rw
      - ../race_stack_cache/humble/log:/ws/log:rw
    environment:
      - USER=race_crew
      - USERNAME=race_crew
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-48}
      - RCUTILS_COLORIZED_OUTPUT=1
      - TERM=xterm-256color
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - RACECAR_VERSION=${RACECAR_VERSION:-NUC1}

  zenoh_router:
    image: race_stack:humble_dev
    pull_policy: never
    depends_on:
      - race_stack
    container_name: forzaeth_zenoh_router
    hostname: ${RACECAR_VERSION:-NUC1}
    env_file:
      - .env
    network_mode: host
    ipc: host
    restart: unless-stopped
    command: bash -c "source /opt/ros/humble/setup.bash && exec ros2 run rmw_zenoh_cpp rmw_zenohd"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-48}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp

  # Virtual desktop for visualisations (RVIZ), required for MacOS
  novnc:
    build: https://github.com/ETH-PBL/remote-novnc.git#main
    image: forzaeth_novnc:latest
    container_name: forzaeth_novnc
    profiles: ["novnc"] # Only start if this profile is enabled (only MacOS)
    restart: unless-stopped
    environment:
      - USER_ID=501
    ports:
      - "127.0.0.1:6501:6501"   
      - "127.0.0.1:20501:20501"
    command:
      - bash
      - -c
      - |
        echo '<meta http-equiv="refresh" content="0; url=vnc.html?autoconnect=true&resize=scale">' > /usr/share/novnc/index.html
        exec /start_vnc.sh
