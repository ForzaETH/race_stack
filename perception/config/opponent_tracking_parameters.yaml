opponent_tracking:
  meas_std_s:
    type: double
    default_value: 0.03
    description: "Measurement noise of the detections along the track (std) [m]"
    read_only: true
    validation:
      gt<>: [0.0]
  meas_std_d:
    type: double
    default_value: 0.02
    description: "Measurement noise of the detections across the track (std) [m]"
    read_only: true
    validation:
      gt<>: [0.0]
  coast_max:
    type: double
    default_value: 0.7
    description: "A confirmed track without detections is kept (coasting) for this long [s]"
    read_only: true
    validation:
      gt_eq<>: [0.0]
  car_length_range:
    type: double_array
    default_value: [0.511, 0.625]
    description: "Opponent car length [min, max] (rules: 568 mm +-10 %). Centre = rear + mean/2, extent = max [m]"
    read_only: true
    validation:
      fixed_size<>: [2]
      element_bounds<>: [0.05, 2.0]
  car_width_range:
    type: double_array
    default_value: [0.266, 0.326]
    description: "Opponent car width [min, max] (rules: 296 mm +-10 %). Extent and footprint use the max [m]"
    read_only: true
    validation:
      fixed_size<>: [2]
      element_bounds<>: [0.05, 2.0]
  heading_alpha:
    type: double
    default_value: 0.7
    description: "Smoothing of the track heading (L-shape fit, map frame): weight of each new scan. Keep high: smoothing lags in corners. Centre = rear + half a car along it"
    read_only: true
    validation:
      bounds<>: [0.0, 1.0]
  min_face_width:
    type: double
    default_value: 0.10
    description: "Publish a track only once its face is at least this wide (rules: 12 cm, minus edge bias) [m]"
    read_only: true
    validation:
      gt<>: [0.0]
  min_face_samples:
    type: int
    default_value: 10
    description: "Scans with a measured face width before a track is published (10 = 0.25 s at 40 Hz)"
    read_only: true
    validation:
      gt<>: [0]
