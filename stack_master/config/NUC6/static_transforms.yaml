# Static transforms of NUC6: where the sensors sit relative to base_link (rear axle centre, on the ground).
# Remeasure after remounting hardware. xyz in metres, rpy in radians (or quat as [x, y, z, w]).
transforms:
  - {
      parent: base_link,
      child: laser,
      xyz: [0.258, 0.0, 0.127],
      rpy: [0.0, 0.0, 0.0],
    }
  - {
      parent: base_link,
      child: imu,
      xyz: [0.07, 0.0, 0.05],
      quat: [0.0, 0.0, -0.7071068, 0.7071068],
    }
  - {
      parent: base_link,
      child: camera_link,
      xyz: [0.317, 0.018, 0.094],
      rpy: [-0.03, -0.241, 0.009],
    }
