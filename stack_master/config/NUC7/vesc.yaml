/**:
  # parameters shared by the vesc nodes and the actuation manager
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    speed_to_erpm_gain: 4800.0
    speed_to_erpm_offset: -5.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    steering_angle_to_servo_gain: 1.131
    steering_angle_to_servo_offset: 0.35

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: 0.0
    brake_max: 100.0
    speed_min: -69000.0
    speed_max: 69000.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.85

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    publish_tf: false
    use_servo_cmd_to_calc_angular_velocity: true
    wheelbase: .321

actuation_manager:
  ros__parameters:
    # speed and steering bounds are derived from the vesc limits and gains above
    max_acceleration: 2.5 # meters/second^2
    max_deceleration: 2.5 # meters/second^2
    max_steering_rate: 2.4615384615 # radians/second
