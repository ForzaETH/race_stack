# Simulator. All parameters and their defaults: perception/config/*_parameters.yaml
# Opponent: gym car body; no odom frame, the laser pose comes straight from map

/**/obstacle_detection:
  ros__parameters:
    odom_frame: ""

/**/opponent_tracking:
  ros__parameters:
    car_length_range: [0.56, 0.60]    # gym car 0.58 x 0.2032: narrower than the rules allow
    car_width_range: [0.19, 0.22]
