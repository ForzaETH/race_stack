global_planner:
  ros__parameters:
    rate: 10 # [hz]
    safety_margin: 0.25 # [m] free space on each side of the car, on top of half its width_m from car_model.yaml
    safety_margin_sp: 0.25 # [m] same, for shortest path optimization
    reverse_mapping: False # By default, do not reverse the direction of the track
    show_plots: False
