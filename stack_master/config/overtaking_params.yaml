# Spline planner (overtaking) params, shared by all cars. Tuned on NUC10.
# Keep obs_traj_tresh >= lateral_width_gb_m (state_machine_params.yaml), otherwise the car gets stuck trailing.
/**/spline_planner:
  ros__parameters:
    pre_apex_0: 4.0
    pre_apex_1: 3.0
    pre_apex_2: 1.5
    post_apex_0: 2.0
    post_apex_1: 3.0
    post_apex_2: 4.0
    evasion_dist: 0.35
    obs_traj_tresh: 0.4
    spline_bound_mindist: 0.15
    fixed_pred_time: 0.15
    kd_obs_pred: 1.0
