launch:

- arg:
    name: "map"
    default: "latest"
    description: "Map at $MAPS_DIR/map to compute the global plan for"

# fail on arguments this launch file does not declare
- check_args: {}

- let:
    name: "map_path"
    value: "$(env MAPS_DIR)/$(var map)"

# Compute and store the global plan of the map
- node:
    pkg: "rs_global_planner"
    exec: "global_planner"
    name: "global_planner"
    output: "screen"
    param:
    - from: "$(find-pkg-share stack_master)/config/global_planner/global_planner_params.yaml"
    - name: "map_path"
      value: "$(var map_path)"

# Serve the map as /map for visualization
- node:
    pkg: "nav2_map_server"
    exec: "map_server"
    name: "map_server"
    output: "screen"
    param:
    - name: "yaml_filename"
      value: "$(var map_path)/$(var map).yaml"

- node:
    pkg: "nav2_lifecycle_manager"
    exec: "lifecycle_manager"
    name: "lifecycle_manager"
    output: "screen"
    param:
    - name: "autostart"
      value: true
    - name: "node_names"
      value: ["map_server"]

# Sector slicer (speed and overtaking sectors); once both are saved, the whole launch ends
- node:
    pkg: "rs_sectors"
    exec: "sector_slicer"
    name: "sector_slicer"
    output: "screen"
    on_exit: "shutdown"
    param:
    - name: "map_path"
      value: "$(var map_path)"
