launch:

- arg:
    name: "racecar"
    default: "$(env RACECAR_VERSION)"
    description: "Car version: NUCX"
    choice:
    - value: "NUC2"
    - value: "NUC4"
    - value: "NUC5"
    - value: "NUC6"
    - value: "NUC7"
    - value: "NUC10"

# fail on arguments this launch file does not declare
- check_args: {}

# launch teleop
- include:
    file: "$(find-pkg-share rs_bringup)/launch/bringup_launch.yaml"
    arg:
    - name: "racecar"
      value: "$(var racecar)"
