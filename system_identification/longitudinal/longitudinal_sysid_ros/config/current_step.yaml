current_step:
  ros__parameters:
    current: 20.0        # [A] clipped by current_min / current_max in vesc.yaml
    accel_time: 1.0      # [s] the car covers about a * accel_time^2 / 2 before it starts braking
    brake_current: 20.0  # [A]
    brake_time: 2.0      # [s] long enough to stop: the VESC driver holds the car afterwards
    deadman_button: 5    # same as autonomous_deadman_button in vesc.yaml
    joy_timeout: 0.2     # [s]

vesc_driver_node:
  ros__parameters:
    # [s] the driver commands 0 erpm this long after the last command, e.g. when current_step dies.
    # Shorter than in vesc.yaml: nothing else guards the car here.
    command_timeout: 0.05
